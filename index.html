:root[data-theme="dark"]{--g1:#03045e;--g2:#0077b6;--g3:#00b4d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
body{background:linear-gradient(165deg,var(--g1),var(--g2) 55%,var(--g3)) fixed;padding-bottom:120px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;box-shadow:0 8px 28px var(--sh)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px}
h1{font-size:22px;margin:0}.sub{font-size:13px;color:var(--muted)}
.ib{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 11px;margin-inline-start:6px;font-size:14px}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--glass);border:1px solid var(--line);margin-inline-start:6px}
.hero{padding:16px;display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0)}
.ring b{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#0a3a7a;color:#fff;font-size:18px}
:root:not([data-theme="dark"]) .ring b{background:var(--glass2);color:var(--text)}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--text)}
.stat:active,.day:active,.task:active{transform:scale(.97)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
.day{flex:none;width:50px;padding:8px 0;border-radius:16px;text-align:center;background:var(--glass);border:1px solid var(--line);font-size:11px;color:var(--muted);position:relative}
.day b{display:block;font-size:17px;color:var(--text)}
.day.on{background:var(--acc);color:var(--accT)}.day.on b{color:var(--accT)}
.day i{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:var(--md)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.cats button{flex:none;padding:6px 13px;border-radius:20px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.cats button.on{background:var(--acc);color:var(--accT);font-weight:700}
.task{display:flex;gap:12px;padding:13px;margin:9px 0;border-inline-start:5px solid var(--lo);transition:transform .15s}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:none;padding:0;font-size:15px}
.done .chk{background:var(--acc);border-color:var(--acc);color:var(--accT)}
.done .t{text-decoration:line-through;opacity:.6}
.body{flex:1;min-width:0}.t{font-weight:600;word-break:break-word}
.m{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.od{color:var(--hi);font-weight:700}
.n{font-size:12px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.empty{text-align:center;color:var(--muted);padding:44px 0}
.pb{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.sub{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;padding-inline-start:4px}
.sub .t2{flex:1;min-width:0;word-break:break-word}.sub.done .t2{text-decoration:line-through;opacity:.6}
.sub .dd{font-size:11px;color:var(--muted)}.sub .dd.od{color:var(--hi);font-weight:700}
.chk.sm{width:22px;height:22px;font-size:12px}
.srow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.srow input[data-f=title]{flex:1 1 100%}
.srow input[type=date],.srow input[type=time]{flex:1;width:auto;min-width:0}
.srow button{flex:none;border:0;background:var(--glass);border-radius:12px;padding:0 12px;color:var(--hi)}
.addsub{width:100%;margin-top:8px;padding:10px;border-radius:14px;border:1px dashed var(--line);background:none}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}.btns.col{flex-direction:column}.btns.col button{flex:none}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;z-index:8;width:min(92%,420px)}
.nav button{flex:1;border:0;background:none;padding:9px 2px;border-radius:18px;font-size:13px;font-weight:600;color:var(--muted)}
.nav button.on{background:var(--acc);color:var(--accT)}
.fab{position:fixed;inset-inline-end:20px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#caf0f8,#48cae4);color:#03045e;font-size:30px;box-shadow:0 10px 24px var(--sh);z-index:9}
.ov{position:fixed;inset:0;background:rgba(0,10,40,.55);display:none;align-items:flex-end;z-index:20}.ov.on{display:flex}
.sheet{width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;background:linear-gradient(180deg,var(--g2),var(--g1));border:1px solid var(--line)}
:root:not([data-theme="dark"]) .sheet{}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .sheet{background:#eaf9fd}}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--glass);color:var(--text);outline:none}
select option{color:#023e8a}
.row{display:flex;gap:8px}.row>*{flex:1}
.qd{display:flex;gap:6px;margin-top:8px}.qd button{flex:1;padding:7px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:12px}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-weight:700}
.btns .p{background:var(--acc);color:var(--accT);border-color:var(--acc)}.btns .d{color:var(--hi)}
.lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(165deg,var(--g1),var(--g2) 55%,var(--g3))}
.lock .glass{width:100%;max-width:360px;padding:26px;text-align:center}
.lock h2{margin:6px 0}.lock input{margin-top:10px;text-align:center}
.lock .p{width:100%;margin-top:14px;padding:13px;border-radius:14px;border:0;background:var(--acc);color:var(--accT);font-weight:700}
.err{color:var(--hi);font-size:13px;min-height:18px;margin-top:8px}
.link{background:none;border:0;color:var(--muted);font-size:12px;margin-top:12px;text-decoration:underline}
.banner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(92%,420px);padding:12px 14px;z-index:40;display:none;align-items:center;gap:10px;background:var(--acc);color:var(--accT);border-radius:18px;font-weight:600;box-shadow:0 10px 30px var(--sh)}
.banner button{margin-inline-start:auto;border:0;background:rgba(0,0,0,.15);border-radius:10px;padding:6px 10px;color:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:#03045e;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;display:none;z-index:30}
